<!doctype html>
<html lang="zh-CN" data-theme="minimalist-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>四遥转发枢纽大屏 · SCADA</title>
  <link rel="stylesheet" href="/static/dashboard.css">
  <link rel="stylesheet" href="/static/ui-theme.css">
  <script defer src="/static/dashboard.js"></script>
</head>
<body data-dashboard="1" data-dash-role="t">
  <header><strong>SCADA · 四遥转发枢纽大屏</strong><a href="/">返回工作台</a></header>
  <main>
    <section class="dash-root" id="dash-root" aria-label="转发端调度枢纽大屏">
      <div class="dash-strip">
        <div class="dash-strip-title">
          <span class="dash-live-dot" id="dash-live-dot" aria-hidden="true"></span>
          <strong id="dash-theme-title">四遥转发枢纽大屏</strong>
          <span class="dash-role-tag" id="dash-role-tag">scdfe_t · 转发枢纽</span>
        </div>
        <div class="dash-kpis" id="dash-kpis" aria-label="转发核心指标"></div>
        <div class="dash-controls">
          <span class="dash-clock" id="dash-clock">--:--:--</span>
          <select id="dash-interval" class="dash-select" aria-label="刷新周期">
            <option value="2000" selected>2s</option>
            <option value="5000">5s</option>
            <option value="10000">10s</option>
            <option value="0">暂停</option>
          </select>
          <a href="/dashboard-all" class="dash-btn" title="进入 S/C/T 三端融合总控大屏">三端合屏 ↗</a>
          <button type="button" id="dash-refresh" class="dash-btn" title="立即刷新 (Alt+R)">刷新</button>
          <button type="button" id="dash-fullscreen" class="dash-btn is-accent" title="切换大屏沉浸模式 (F)">大屏模式</button>
        </div>
      </div>

      <!-- T 端专属：上宽幅桑基流量枢纽+双半圆保真仪 / 下三栏对账与调度 -->
      <div class="dash-layout-t">
        <div class="dash-t-top">
          <!-- 上左主视觉：端到端四遥分发桑基流向图 -->
          <article class="dash-card">
            <div class="dash-card-head">
              <h2>端到端四遥分发桑基枢纽</h2>
              <span class="dash-card-meta" id="dash-sankey-meta">—</span>
            </div>
            <div class="dash-card-body dash-topo-wrap" id="dash-sankey-host"></div>
          </article>

          <!-- 上右：映射覆盖 & 零偏差保真双半圆刻度仪 -->
          <article class="dash-card">
            <div class="dash-card-head">
              <h2>转发覆盖与保真双仪</h2>
              <span class="dash-card-meta" id="dash-semi-meta">—</span>
            </div>
            <div class="dash-card-body dash-semi-wrap">
              <div class="dash-semi-pair" id="dash-semi-svg"></div>
              <div class="dash-gauge-stats" id="dash-gauge-stats"></div>
            </div>
          </article>
        </div>

        <div class="dash-t-bottom">
          <!-- 下左：四遥映射覆盖对比棒图 / 通道柱状图双视图 -->
          <article class="dash-card">
            <div class="dash-card-head">
              <h2>四遥映射覆盖与通道规模</h2>
              <div class="dash-seg" id="dash-t-left-tabs" role="tablist">
                <button type="button" class="is-active" data-tleft-tab="bars" role="tab" aria-selected="true">覆盖棒图</button>
                <button type="button" data-tleft-tab="cols" role="tab" aria-selected="false">通道柱图</button>
              </div>
            </div>
            <div class="dash-card-body dash-t-left-body">
              <div class="dash-hbar-wrap" id="dash-hbar-host"></div>
              <div class="dash-canvas-wrap dash-t-bar-box" id="dash-t-bar-box" hidden>
                <div class="dash-legend dash-t-inline-legend" id="dash-bar-legend"></div>
                <canvas id="dash-bar-canvas" class="dash-canvas"></canvas>
                <div id="dash-bar-tip" class="dash-tooltip" hidden></div>
              </div>
            </div>
          </article>

          <!-- 下中：转发吞吐趋势平滑双曲线 -->
          <article class="dash-card">
            <div class="dash-card-head">
              <h2>转发吞吐趋势曲线</h2>
              <div class="dash-legend" id="dash-trend-legend"></div>
            </div>
            <div class="dash-card-body dash-canvas-wrap">
              <canvas id="dash-trend-canvas" class="dash-canvas"></canvas>
              <div id="dash-trend-tip" class="dash-tooltip" hidden></div>
            </div>
          </article>

          <!-- 下右：全链路对账偏差监视 & 上游主站动态 -->
          <article class="dash-card">
            <div class="dash-card-head">
              <h2>全链路对账护航与主站流</h2>
              <span class="dash-card-meta" id="dash-feed-meta">—</span>
            </div>
            <div class="dash-card-body dash-feed-wrap">
              <div class="dash-shield-banner" id="dash-shield-banner"></div>
              <div class="dash-feed-list" id="dash-feed-list"></div>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
